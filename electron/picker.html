<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Escolher tela/janela</title>
  <style>
    body {
      margin: 0; padding: 16px; background: #101216; color: #e7e9ee;
      font-family: system-ui, sans-serif;
    }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .item {
      cursor: pointer; background: #1a1d24; border: 2px solid #2c313c;
      border-radius: 8px; padding: 6px; text-align: center;
    }
    .item:hover { border-color: #5b8cff; }
    .item img { width: 100%; height: 90px; object-fit: cover; border-radius: 4px; background: #000; }
    .item span { display: block; font-size: 11px; margin-top: 6px; color: #8a90a0; word-break: break-word; }
    .cancel { margin-top: 14px; }
    button {
      cursor: pointer; border-radius: 8px; border: 1px solid #2c313c;
      padding: 8px 14px; background: #22262f; color: #e7e9ee; font-size: 13px;
    }
  </style>
</head>
<body>
  <h2>O que você quer compartilhar?</h2>
  <div id="grid" class="grid"></div>
  <div class="cancel"><button id="cancelBtn">Cancelar</button></div>
  <script>
    window.addEventListener('error', (ev) => {
      document.body.insertAdjacentHTML('afterbegin', `<pre style="color:#ff5c5c;white-space:pre-wrap;">ERRO: ${ev.message}</pre>`);
    });

    const grid = document.getElementById('grid');
    if (!window.picker) {
      document.body.insertAdjacentHTML('afterbegin', '<pre style="color:#ff5c5c;">window.picker não existe — o preload não carregou.</pre>');
    } else {
      window.picker.getSources()
        .then((sources) => {
          if (!sources.length) {
            grid.innerHTML = '<p style="color:#8a90a0;">Nenhuma tela/janela encontrada (desktopCapturer voltou vazio).</p>';
            return;
          }
          for (const s of sources) {
            const item = document.createElement('div');
            item.className = 'item';
            item.innerHTML = `<img src="${s.thumbnail}" alt="" /><span>${s.name}</span>`;
            item.addEventListener('click', () => window.picker.choose(s.id));
            grid.appendChild(item);
          }
        })
        .catch((err) => {
          grid.innerHTML = `<pre style="color:#ff5c5c;white-space:pre-wrap;">Erro ao listar telas/janelas: ${err.message || err}</pre>`;
        });
    }
    document.getElementById('cancelBtn').addEventListener('click', () => window.picker.cancel());
  </script>
</body>
</html>
